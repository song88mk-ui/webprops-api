name: WebProps API - production

on:
  push:
    tags:
      - 'v**'

permissions:
  id-token: write
  contents: read

env:
  REPO_NAME: webprops-api

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Get version/tag
        id: tag
        run: |
          v=`echo $GITHUB_REF_NAME | sed "s/\([0-9.]*\)/\1/"`
          echo "version=$v" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ env.REPO_NAME }}:${{ steps.tag.outputs.version }}

  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment:
      name: production
    needs: build
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ vars.ACA_CONTAINER_NAME }}
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.REGISTRY }}/${{ env.REPO_NAME }}:${{ needs.build.outputs.version }}
          disableTelemetry: true
